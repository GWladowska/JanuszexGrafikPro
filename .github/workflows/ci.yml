name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    env:
      SUPABASE_CLI_VERSION: "2.117.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assert pinned Supabase CLI matches lockfile
        run: |
          locked=$(node -p "require('./package-lock.json').packages['node_modules/supabase'].version")
          test "$locked" = "$SUPABASE_CLI_VERSION" || { echo "SUPABASE_CLI_VERSION=$SUPABASE_CLI_VERSION != lockfile=$locked"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Get Supabase anon key
        id: supabase-key
        run: echo "key=$(supabase status -o json | jq -r '.PUBLISHABLE_ANON_KEY // .ANON_KEY')" >> "$GITHUB_OUTPUT"
      - run: npm run test:integration
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: ${{ steps.supabase-key.outputs.key }}
